<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | Patient Portal | The Joy In Living</title>
  <link rel="icon" type="image/svg+xml" href="/thejoyinliving/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/thejoyinliving/css/portal.css">
</head>
<body class="portal-body">
  <div class="portal-lang-bar">
    <button class="plang-btn active" onclick="setLang('en')">English</button>
    <button class="plang-btn" onclick="setLang('es')">Español</button>
  </div>
  <div class="portal-wrap">
    <aside class="portal-sidebar">
      <a href="/thejoyinliving/patient-portal/" class="portal-logo"><img src="/thejoyinliving/images/logo.png" alt="The Joy In Living"></a>
      <nav class="portal-nav">
        <a href="/thejoyinliving/patient-portal/" class="portal-nav__item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Home</span></a>
        <a href="/thejoyinliving/patient-portal/appointments/" class="portal-nav__item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Appointments</span></a>
        <a href="/thejoyinliving/patient-portal/telehealth/" class="portal-nav__item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 10l4.553-2.276A1 1 0 0 1 21 8.618v6.764a1 1 0 0 1-1.447.894L15 14M3 8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z"/></svg><span>Telehealth</span></a>
        <a href="/thejoyinliving/patient-portal/notifications/" class="portal-nav__item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span>Notifications</span></a>
        <a href="/thejoyinliving/patient-portal/login/" class="portal-nav__item active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg><span>Log In</span></a>
      </nav>
      <div class="portal-sidebar__footer">
        <p class="portal-sidebar__contact">Need help?</p>
        <a href="tel:9146862484" class="portal-sidebar__phone">(914) 686-2484</a>
        <a href="/thejoyinliving/" class="portal-sidebar__back"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg><span>Back to main site</span></a>
      </div>
    </aside>
    <main class="portal-main" style="display:flex;align-items:flex-start;justify-content:center;padding-top:80px;">
      <div style="width:100%;max-width:420px;">
        <!-- Logo on mobile -->
        <div style="text-align:center;margin-bottom:32px;">
          <div style="width:56px;height:56px;background:linear-gradient(135deg,#3D4F3D,#5C7A5C);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:1.5rem;color:white;font-weight:800;">J</div>
          <h1 style="font-size:22px;font-weight:700;margin-bottom:6px;" data-en="Welcome Back" data-es="Bienvenido/a">Welcome Back</h1>
          <p style="font-size:14px;color:#6B7B6B;" data-en="Sign in to your patient portal account." data-es="Inicie sesión en su cuenta del portal del paciente.">Sign in to your patient portal account.</p>
        </div>

        <div class="portal-form-card" style="padding:32px;">
          <div id="login-error" class="portal-alert portal-alert--error" data-en="Incorrect email or password. Please try again." data-es="Correo o contraseña incorrectos. Por favor intente de nuevo.">Incorrect email or password. Please try again.</div>

          <form onsubmit="doLogin(event)">
            <div class="portal-form-group">
              <label class="portal-label">Email</label>
              <input type="email" class="portal-input" id="login-email" placeholder="jane@email.com" required autocomplete="email">
            </div>
            <div class="portal-form-group">
              <label class="portal-label" style="display:flex;justify-content:space-between;align-items:center;">
                <span data-en="Password" data-es="Contraseña">Password</span>
                <a href="/thejoyinliving/patient-portal/recover/" class="portal-form-link" style="font-weight:500;font-size:12px;" data-en="Forgot password?" data-es="¿Olvidó su contraseña?">Forgot password?</a>
              </label>
              <div style="position:relative;">
                <input type="password" class="portal-input" id="login-password" placeholder="••••••••" required autocomplete="current-password" style="padding-right:44px;">
                <button type="button" onclick="togglePw()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#9AA99A;" title="Show/hide password">
                  <svg id="pw-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <div class="portal-checkbox-row" style="margin-bottom:24px;">
              <input type="checkbox" id="remember-me">
              <label for="remember-me" data-en="Remember me on this device" data-es="Recordarme en este dispositivo">Remember me on this device</label>
            </div>
            <button type="submit" class="portal-btn" data-en="Log In" data-es="Entrar">Log In</button>
          </form>

          <div class="portal-divider-text"><span data-en="or" data-es="o">or</span></div>

          <a href="https://www.therapyportal.com/p/joyliving/" target="_blank" class="portal-btn portal-btn--outline" data-en="Log In via TherapyPortal.com ↗" data-es="Entrar via TherapyPortal.com ↗">Log In via TherapyPortal.com ↗</a>
        </div>

        <p style="text-align:center;margin-top:20px;font-size:13px;color:#6B7B6B;">
          <span data-en="New client? " data-es="¿Cliente nuevo/a? ">New client? </span>
          <a href="/thejoyinliving/patient-portal/appointments/" class="portal-form-link" data-en="Request an appointment →" data-es="Solicitar una cita →">Request an appointment →</a>
        </p>
      </div>
    </main>
  </div>
  <script src="/thejoyinliving/js/portal.js"></script>
  <script>
    function togglePw() {
      const input = document.getElementById('login-password');
      input.type = input.type === 'password' ? 'text' : 'password';
    }
    function doLogin(e) {
      e.preventDefault();
      // Redirect to actual TherapyPortal login
      window.location.href = 'https://www.therapyportal.com/p/joyliving/';
    }
  </script>
</body>
</html>
