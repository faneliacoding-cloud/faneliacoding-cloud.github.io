<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Studio — Login | Mindset Therapy</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="../../assets/logos/mindset-logo-favicon.png" />
  <link rel="stylesheet" href="studio.css" />
</head>
<body class="login-page">

  <div class="login-card">
    <img src="../../assets/mindset-logo-real.jpg" alt="Mindset Therapy" class="login-logo" />
    <h1>Blog <em>Studio</em></h1>
    <p class="login-subtitle">Sign in to manage your blog posts</p>
    <div id="testBanner" style="display:none;background:#EAFAF1;border:1px solid #C5D4C0;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:0.78rem;color:#2C2C2C;line-height:1.5;text-align:left">
      <strong>🧪 Test Mode</strong> — Firebase not connected yet.<br>
      Email: <code style="background:#fff;padding:2px 6px;border-radius:4px">admin@mindset.com</code><br>
      Password: <code style="background:#fff;padding:2px 6px;border-radius:4px">admin123</code>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="your@email.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-gold btn-block" id="loginBtn" style="margin-top:8px">
        Sign In
      </button>
    </form>

    <p class="login-error" id="loginError"></p>
    <button onclick="resetPassword()" style="background:none;border:none;color:#C9A96E;font-family:inherit;font-size:0.82rem;cursor:pointer;margin-top:14px;transition:color 0.2s" onmouseover="this.style.color='#2C2C2C'" onmouseout="this.style.color='#C9A96E'">Forgot password?</button>
  </div>

  <div class="toast" id="toast"></div>

  <script src="firebase-config.js"></script>
  <script>
    // If already logged in, redirect to dashboard
    (async () => {
      if (TEST_MODE) {
        document.getElementById('testBanner').style.display = 'block';
        if (sessionStorage.getItem('mt_test_auth') === 'true') {
          window.location.href = 'index.html';
        }
        return;
      }
      try {
        const auth = await getAuth();
        const { onAuthStateChanged } = await import(`${FB_CDN}/firebase-auth.js`);
        onAuthStateChanged(auth, (user) => {
          if (user && user.uid === ADMIN_UID) {
            window.location.href = 'index.html';
          }
        });
      } catch (e) {}
    })();

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('loginError');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      errEl.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const cred = await signIn(email, password);
        if (!TEST_MODE && cred.user.uid !== ADMIN_UID) {
          // Not the admin — sign them out
          const auth = await getAuth();
          const { signOut: fbSignOut } = await import(`${FB_CDN}/firebase-auth.js`);
          await fbSignOut(auth);
          errEl.textContent = 'Access denied. This login is for the site owner only.';
          errEl.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Sign In';
          return;
        }
        window.location.href = 'index.html';
      } catch (err) {
        let msg = 'Sign in failed. Please try again.';
        if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password') {
          msg = 'Incorrect email or password.';
        } else if (err.code === 'auth/user-not-found') {
          msg = 'No account found with this email.';
        } else if (err.code === 'auth/too-many-requests') {
          msg = 'Too many attempts. Please try again later.';
        } else if (err.code === 'auth/network-request-failed') {
          msg = 'Network error. Check your connection.';
        } else if (firebaseConfig.apiKey === 'YOUR_API_KEY') {
          msg = 'Firebase is not configured yet. Please set up your Firebase project first.';
        }
        errEl.textContent = msg;
        errEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    async function resetPassword() {
      if (TEST_MODE) {
        const errEl = document.getElementById('loginError');
        errEl.textContent = 'Test mode: use admin@mindset.com / admin123';
        errEl.classList.add('show');
        return;
      }
      const email = document.getElementById('email').value.trim();
      const errEl = document.getElementById('loginError');
      if (!email) {
        errEl.textContent = 'Enter your email above first, then click Forgot password.';
        errEl.classList.add('show');
        return;
      }
      try {
        const auth = await getAuth();
        const { sendPasswordResetEmail } = await import(`${FB_CDN}/firebase-auth.js`);
        await sendPasswordResetEmail(auth, email);
        errEl.classList.remove('show');
        const toast = document.getElementById('toast');
        toast.textContent = '✅ Password reset email sent! Check your inbox.';
        toast.className = 'toast show success';
        setTimeout(() => toast.className = 'toast', 4000);
      } catch (err) {
        errEl.textContent = err.code === 'auth/user-not-found' ? 'No account found with this email.' : 'Could not send reset email. Try again.';
        errEl.classList.add('show');
      }
    }
  </script>
</body>
</html>
