<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JCL Staging &amp; Design | Luxury Home Staging New York</title>
  <meta name="description" content="JCL Staging &amp; Design — New York's premier luxury home staging studio. Serving Manhattan, Brooklyn, New Jersey, and Connecticut since 2017." />
  <!-- Instant redirect to JCL staging site -->
  <meta http-equiv="refresh" content="0; url=jcl-staging/" />
  <link rel="canonical" href="https://faneliacoding-cloud.github.io/jcl-staging/" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Georgia', serif;
      background: #FAF8F5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #1A1714;
    }
    .redirect-wrap {
      text-align: center;
      padding: 2rem;
    }
    .logo-jcl {
      display: block;
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 0.35em;
      margin-bottom: 0.25rem;
    }
    .logo-sub {
      display: block;
      font-family: 'Arial', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #9B938D;
      margin-bottom: 2rem;
    }
    .loading-bar {
      width: 120px;
      height: 1px;
      background: #E8E0D5;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 1px;
    }
    .loading-fill {
      height: 100%;
      background: #B08D6A;
      animation: load 0.8s ease-out forwards;
    }
    @keyframes load {
      from { width: 0; }
      to { width: 100%; }
    }
    a {
      display: block;
      margin-top: 1.5rem;
      font-family: 'Arial', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #B08D6A;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="redirect-wrap">
    <span class="logo-jcl">JCL</span>
    <span class="logo-sub">Staging &amp; Design</span>
    <div class="loading-bar"><div class="loading-fill"></div></div>
    <a href="jcl-staging/">Entering site →</a>
  </div>
  <script>
    // Instant JS redirect as backup
    window.location.replace('jcl-staging/');
  </script>
</body>
</html>
